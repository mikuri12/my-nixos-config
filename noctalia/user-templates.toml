[config]

[templates]

[templates.halley-colors]
input_path = '~/.config/noctalia/templates/halley-colors.rune'
output_path = '~/.config/halley/colors.rune'
post_hook = 'halleyctl reload'

[templates.rmpc]
input_path = '~/.config/noctalia/templates/rmpc-theme.ron'
output_path = '~/.config/rmpc/themes/current.ron'
# Opcional: comando para recargar rmpc después de generar el tema
#post_hook = 'pkill -USR1 rmpc'  # o el comando que uses para recargar

[templates.discord]
input_path = '~/.config/noctalia/templates/discord.css'
output_path = '~/.config//vesktop/themes/system24.theme.css'

